name: Build BB Binaries

on:
  workflow_dispatch:
    inputs:
      bb_version:
        description: 'BB version tag (e.g., v3.0.0-nightly.20251104)'
        required: true
        default: 'v3.0.0-nightly.20251104'

jobs:
  build-bb:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build BB
        env:
          BB_VERSION: ${{ github.event.inputs.bb_version }}
        run: |
          chmod +x ./compile_bb.sh
          ./compile_bb.sh

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="bb-${{ github.event.inputs.bb_version }}"
          gh release create "$TAG" \
            --title "BB ${{ github.event.inputs.bb_version }} (Ubuntu 22.04)" \
            --notes "Pre-compiled BB binary for ${{ github.event.inputs.bb_version }} built on Ubuntu 22.04" \
            ~/.bb/bb
